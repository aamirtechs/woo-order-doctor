[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "woo-order-doctor"
version = "1.0.0"
description = "Offline WooCommerce orders CSV audit CLI: duplicates, line-item mismatches, missing emails, refunds, stuck pending orders"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
woo-order-doctor = "woo_order_doctor:main"

[tool.setuptools]
py-modules = ["woo_order_doctor"]
